<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="%BASE_URL%favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>ExplainShot — Explain Your Screenshots with AI</title>
    <meta name="title" content="ExplainShot — Explain Your Screenshots with AI">
    <meta name="description" content="Capture any region of your screen and have a conversation about it with a vision-capable AI. Works with Ollama, LM Studio, and any OpenAI-compatible endpoint — run a local model to keep your data private.">
    <meta name="keywords" content="screenshot, AI, vision AI, Ollama, LM Studio, OpenAI, screen capture, explain, local AI, desktop app">
    <meta name="author" content="ExplainShot">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://explainshot.com/">
    <meta property="og:title" content="ExplainShot — Explain Your Screenshots with AI">
    <meta property="og:description" content="Capture any region of your screen and have a conversation about it with a vision-capable AI. Works with Ollama, LM Studio, and any OpenAI-compatible endpoint — run a local model to keep your data private.">
    <meta property="og:image" content="/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://explainshot.com/">
    <meta property="twitter:title" content="ExplainShot — Explain Your Screenshots with AI">
    <meta property="twitter:description" content="Capture any region of your screen and have a conversation about it with a vision-capable AI. Works with Ollama, LM Studio, and any OpenAI-compatible endpoint — run a local model to keep your data private.">
    <meta property="twitter:image" content="/og-image.png">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png">
    <link rel="manifest" href="%BASE_URL%site.webmanifest">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme color -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="msapplication-TileColor" content="#3b82f6">

    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <style>
      html { visibility: hidden; }
      html.light, html.dark { visibility: visible; }
    </style>

    <!-- Apply theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('explainshot-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>

    <!-- Privacy-friendly analytics placeholder -->
    <!-- <script defer data-domain="explainshot.com" src="https://plausible.io/js/script.js"></script> -->
  </body>
</html>
